<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lumi — панорама из 3 обложек</title>
<style>
  /* Холст = три обложки Reels 1080×1920 рядом. В сетке профиля Instagram
     показывает середину каждой — полосу 1080×1440 (y 240…1680), поэтому всё
     важное живёт там, а текст держится подальше от стыков на x = 1080 и 2160. */
  @font-face { font-family: "Unbounded"; font-weight: 300; src: url("../print/fonts/Unbounded-300.ttf"); }
  @font-face { font-family: "Unbounded"; font-weight: 400; src: url("../print/fonts/Unbounded-400.ttf"); }
  @font-face { font-family: "Unbounded"; font-weight: 600; src: url("../print/fonts/Unbounded-600.ttf"); }
  @font-face { font-family: "Manrope"; font-weight: 600; src: url("../print/fonts/Manrope-600.ttf"); }

  :root { --teal: #6cc4c9; --floor: 1060px; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 3240px; height: 1920px; overflow: hidden; background: #000; }

  .stage {
    position: relative; width: 3240px; height: 1920px; overflow: hidden;
    background:
      radial-gradient(1500px 620px at 50% var(--floor), #0c3a3d 0%, #04181a 45%, #000 75%),
      #000;
  }


  /* Развороты стоят на неоновой линии и отражаются в «полу» */
  .row { position: absolute; left: 0; right: 0; top: 0; height: var(--floor); perspective: 2600px; }
  .album {
    position: absolute; bottom: 0; width: 760px; aspect-ratio: 1400 / 1009;
    background-size: cover; background-position: center;
    border-radius: 6px;
    box-shadow: 0 0 0 2px #ffffff14, 0 30px 80px #000, 0 0 90px #6cc4c933;
    -webkit-box-reflect: below 6px linear-gradient(transparent 55%, #ffffff40);
    transform-origin: 50% 100%;
  }
  .a1 { left: 40px;   transform: rotateY(38deg)  scale(.86); background-image: url("../img/works/split-1-04.jpg"); }
  .a2 { left: 640px;  transform: rotateY(22deg)  scale(.94); background-image: url("../img/works/flight-2-03.jpg"); }
  .a3 { left: 1240px; transform: translateZ(80px);            background-image: url("../img/works/freedom-3-01.jpg"); }
  .a4 { left: 1840px; transform: rotateY(-22deg) scale(.94); background-image: url("../img/works/split-1-05.jpg"); }
  .a5 { left: 2440px; transform: rotateY(-38deg) scale(.86); background-image: url("../img/works/flight-2-06.jpg"); }

  /* Неоновая линия-подиум */
  .neon {
    position: absolute; left: 0; right: 0; top: calc(var(--floor) + 2px); height: 4px;
    background: linear-gradient(90deg, #6cc4c900, var(--teal) 12%, #d9fbfc 50%, var(--teal) 88%, #6cc4c900);
    box-shadow: 0 0 18px var(--teal), 0 0 60px #6cc4c9aa, 0 0 140px #6cc4c966;
  }
  .floor-fade { position: absolute; left: 0; right: 0; top: var(--floor); height: 860px;
    background: linear-gradient(180deg, #0000 0%, #000000b3 38%, #000 70%); }

  /* Логотип и подпись — в центральном посте */
  .brand { position: absolute; left: 1080px; width: 1080px; top: 1120px; text-align: center; }
  .brand img { width: 560px; margin: 0 auto; display: block; filter: drop-shadow(0 0 40px #6cc4c955); }
  .brand h1 { margin-top: 46px; font: 300 64px/1.15 "Unbounded"; color: #ecf1f1; letter-spacing: -1px; }
  .brand h1 b { font-weight: 400; color: var(--teal); }
  .brand p { margin-top: 30px; font: 600 26px/1 "Manrope"; letter-spacing: 10px; text-transform: uppercase; color: #8fb9bb; }

  /* Мелкие подписи по краям — продолжают ритм в левом и правом постах */
  .side { position: absolute; top: 1290px; width: 1080px; text-align: center; font: 300 40px/1.3 "Unbounded"; color: #cfe6e7; }
  .side small { display: block; margin-top: 18px; font: 600 24px/1 "Manrope"; letter-spacing: 8px; color: var(--teal); text-transform: uppercase; }
  .s-left { left: 0; } .s-right { left: 2160px; }
</style>
</head>
<body>
<div class="stage">
  <div class="row">
    <div class="album a1"></div><div class="album a2"></div><div class="album a5"></div><div class="album a4"></div><div class="album a3"></div>
  </div>
  <div class="floor-fade"></div>
  <div class="neon"></div>

  <div class="side s-left">Съёмка<br>и дизайн<small>Свой стиль класса</small></div>
  <div class="brand">
    <img src="../img/logo.svg" alt="LUMI">
    <h1>Выпускные альбомы<br><b>под ключ</b></h1>
    <p>Бишкек · @lumi.vinetka</p>
  </div>
  <div class="side s-right">Печать<br>и выдача<small>По договору</small></div>
</div>
</body>
</html>
